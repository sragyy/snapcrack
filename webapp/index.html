<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>CAROUBOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/design-system.css"/>
<link rel="stylesheet" href="assets/css/app.css"/>
<link rel="stylesheet" href="assets/css/theme-neon.css"/>
<link rel="stylesheet" href="assets/css/motion.css"/>
<link rel="stylesheet" href="assets/css/premium.css"/>
<link rel="stylesheet" href="assets/css/mascot.css"/>
</head>
<body>
<div id="app"></div>

<script>window.CAROUBOT_PAGE = "home"; window.CAROUBOT_CREDITS = null; /* null = non connecté */</script>
<script src="assets/js/config.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/mascot.js"></script>
<script src="assets/js/shell.js"></script>
<script>
(function () {
  const I = window.ICON;
  const el = window.CAROUBOT_SHELL.pageEl;
  const creations = window.CAROUBOT_STORE.getCreations();
  const nb = creations.length;

  el.innerHTML = `
    <!-- Bandeau d'accueil -->
    <section class="welcome-hero">
      <div class="wh-grid" aria-hidden="true"></div>
      <div class="wh-copy">
        <div class="wh-kicker">Bienvenue sur</div>
        <h1 class="wh-title">CAROU<span>BOT</span></h1>
        <p class="wh-sub">Crée, analyse et trouve les meilleurs carrousels TikTok en quelques clics !</p>
        <p class="wh-sub-mobile">Crée, Analyse, Performe</p>
      </div>
      <div class="wh-stage" aria-hidden="true">
        <div class="wh-ring r3"></div><div class="wh-ring wave"></div><div class="wh-ring wave w2"></div><div class="wh-ring r1"></div><div class="wh-ring r2"></div>
        <div class="wh-beam"></div>
        <div class="wh-float f1">${I.image}</div>
        <div class="wh-float f2">${I.layers}</div>
        <div class="wh-float f3">${I.sparkles}</div>
        <img class="wh-robot" src="assets/img/caroubot-mascot.svg" alt="">
      </div>
    </section>

    <!-- Deux grandes cartes -->
    <div class="grid grid-2 hero-row">
      <a href="carouslide.html" class="card hero-card hero-violet">
        <span class="hero-wm">${I.image}</span>
        <div class="hero-ico">${I.image}</div>
        <div class="hero-txt">
          <h2>CarouSlide</h2>
          <p>Génère des carrousels images IA ultra performants</p>
          <span class="hero-short">Générer un carrousel IA</span>
        </div>
        <span class="hero-go">${I.arrowRight}</span>
      </a>
      <a href="carouradar.html" class="card hero-card hero-cyan">
        <span class="hero-wm">${I.radar}</span>
        <div class="hero-ico">${I.radar}</div>
        <div class="hero-txt">
          <h2>CarouRadar</h2>
          <p>Découvre les carrousels TikTok les plus performants</p>
          <span class="hero-short">Découvrir les tops TikTok</span>
        </div>
        <span class="hero-go">${I.arrowRight}</span>
      </a>
    </div>

    <!-- Stat tiles : valeurs réelles ou "à connecter", jamais inventées -->
    <div class="grid grid-4 stat-row">
      <div class="card stat-card">
        <div class="stat-ico amber">${I.coins}</div>
        <div><div class="stat-val mono">—</div><div class="stat-label">Crédits disponibles</div><span class="stat-soon">À connecter au bot</span></div>
      </div>
      <div class="card stat-card">
        <div class="stat-ico violet">${I.bolt}</div>
        <div><div class="stat-val mono">${nb}</div><div class="stat-label">Carrousels créés</div></div>
      </div>
      <div class="card stat-card">
        <div class="stat-ico cyan">${I.chart}</div>
        <div><div class="stat-val mono">—</div><div class="stat-label">Performance moyenne</div><span class="stat-soon">À connecter</span></div>
      </div>
      <div class="card stat-card">
        <div class="stat-ico gold">${I.crown}</div>
        <div><div class="stat-val" style="font-size:19px">Abonnement</div><div class="stat-label">Renouvellement : à connecter</div></div>
      </div>
    </div>

    <!-- Mes créations récentes -->
    <section class="card recent-panel">
      <div class="section-head">
        <h2 class="section-title">${I.image} Mes créations récentes</h2>
        <a href="creations.html" class="btn btn-ghost btn-sm see-all">Voir tout ${I.arrowRight}</a>
      </div>
      <div class="recent-wrap">
        <button class="rc-arrow left" id="carPrev" aria-label="Précédent">${I.chevL}</button>
        <div id="homeCreations" class="hcarousel"></div>
        <button class="rc-arrow right" id="carNext" aria-label="Suivant">${I.chevR}</button>
      </div>
      <div class="rc-dots" id="rcDots"></div>
    </section>
  `;

  const wrap = document.getElementById("homeCreations");
  if (!nb) {
    // Emplacements vides stylés (aucune création fictive)
    wrap.innerHTML = [1,2,3,4].map(i => `
      <a class="rc-card rc-empty" href="carouslide.html">
        <span class="rc-plus">${I.plus}</span>
        <strong>${i===1 ? "Ta première création" : "Emplacement libre"}</strong>
        <small>${i===1 ? "Lance CarouSlide" : "Tes carrousels apparaîtront ici"}</small>
      </a>`).join("");
  } else {
    wrap.innerHTML = creations.slice(0, 12).map(c => `
      <a class="rc-card" href="creations.html">
        <div class="rc-thumb">${I.slide}</div>
        <strong class="rc-title">${c.title}</strong>
        <span class="rc-meta">${I.image} ${c.links ? c.links + " liens" : (c.slides ?? 0) + " slides"}</span>
        ${c.status === "pending_backend" ? `<span class="badge badge-warning rc-state">En attente</span>`
          : c.status === "running" ? `<span class="badge badge-cyan rc-state">${c.progress}%</span>`
          : `<span class="badge badge-success rc-state">Terminé</span>`}
      </a>`).join("");
  }

  // Défilement + points de pagination
  const dots = document.getElementById("rcDots");
  const pages = () => Math.max(1, Math.ceil(wrap.scrollWidth / wrap.clientWidth));
  function drawDots() {
    const n = pages(), cur = Math.round(wrap.scrollLeft / Math.max(1, wrap.clientWidth));
    dots.innerHTML = n > 1 ? Array.from({length:n}, (_, i) => `<span class="${i===cur?'on':''}"></span>`).join("") : `<span class="on"></span>`;
  }
  document.getElementById("carPrev").addEventListener("click", () => wrap.scrollBy({ left: -wrap.clientWidth, behavior: "smooth" }));
  document.getElementById("carNext").addEventListener("click", () => wrap.scrollBy({ left: wrap.clientWidth, behavior: "smooth" }));
  wrap.addEventListener("scroll", () => requestAnimationFrame(drawDots));
  window.addEventListener("resize", drawDots);
  drawDots();
})();
</script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/premium.js"></script>
</body>
</html>
