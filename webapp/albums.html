<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>CAROUBOT — Mes Albums</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/design-system.css"/>
<link rel="stylesheet" href="assets/css/app.css"/>
</head>
<body>
<div id="app"></div>

<script>window.CAROUBOT_PAGE = "albums"; window.CAROUBOT_CREDITS = null;</script>
<script src="assets/js/config.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/mascot.js"></script>
<script src="assets/js/shell.js"></script>
<script>
(function () {
  const I = window.ICON;
  const CFG = window.CAROUBOT_CONFIG;
  const el = window.CAROUBOT_SHELL.pageEl;

  // Les albums viennent du backend (galerie des carrousels générés).
  // Sans backend : état vide honnête (aucun faux album).
  const state = { view: "folders", albums: [], images: [], selected: new Set() };

  el.innerHTML = `
    <div class="page-head">
      <h1 class="page-title">${I.albums} Mes Albums</h1>
      <p class="page-subtitle">Retrouvez, organisez et téléchargez vos carrousels générés.</p>
    </div>

    <div class="toolbar">
      <div class="seg" id="viewSeg">
        <button data-view="folders" class="active">${I.folder} Dossiers</button>
        <button data-view="all">${I.image} Toutes les images</button>
      </div>
      <button class="btn btn-ghost btn-sm" id="btnNewFolder" style="margin-left:auto">${I.plus} Nouveau dossier</button>
    </div>

    <div id="albumsContent"></div>
    <div id="albumsActionBar"></div>
  `;

  document.getElementById("viewSeg").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    state.view = b.dataset.view; state.selected.clear();
    document.querySelectorAll("#viewSeg button").forEach(x => x.classList.remove("active"));
    b.classList.add("active"); render();
  });
  document.getElementById("btnNewFolder").addEventListener("click", () => {
    if (CFG.backendConnected) { /* TODO POST /api/albums */ }
    else toast("Création de dossier disponible une fois le backend connecté", "violet");
  });

  function render() {
    const c = document.getElementById("albumsContent");

    if (!CFG.backendConnected) {
      c.innerHTML = `<div class="empty">${I.albums}
        <h4>Aucun album pour le moment</h4>
        <p class="section-sub">Vos carrousels générés apparaîtront ici une fois CarouSlide et le backend connectés (galerie <code>${CFG.api.albums}</code>). Aucun album de démonstration n'est affiché.</p>
        <a class="btn btn-primary" href="carouslide.html" style="margin-top:14px">${I.slide} Créer un carrousel</a>
      </div>`;
      document.getElementById("albumsActionBar").innerHTML = "";
      return;
    }

    if (state.view === "folders") {
      if (!state.albums.length) { c.innerHTML = emptyFolders(); return; }
      c.className = "";
      c.innerHTML = `<div class="grid grid-4">${state.albums.map(a => `
        <div class="card card-hover album-card">
          <div class="album-cover">${I.folder}<span class="badge badge-violet" style="position:absolute;top:10px;right:10px">${a.count}</span></div>
          <div class="album-body"><div class="album-title">${a.name}</div><div class="album-meta">${a.count} carrousels</div></div>
        </div>`).join("")}</div>`;
    } else {
      if (!state.images.length) { c.innerHTML = emptyFolders(); return; }
      c.innerHTML = `<div class="gallery-grid">${state.images.map(img => `
        <div class="gallery-item" data-id="${img.id}">
          <span class="ck ${state.selected.has(img.id)?'checked':''}" data-ck="${img.id}">${I.check}</span>
          ${img.src ? `<img src="${img.src}"/>` : I.image}
          <button class="dl" data-dl="${img.id}">${I.download}</button>
        </div>`).join("")}</div>`;
      c.querySelectorAll("[data-ck]").forEach(k => k.addEventListener("click", () => { const id = k.dataset.ck; state.selected.has(id)?state.selected.delete(id):state.selected.add(id); render(); }));
    }
    renderBar();
  }

  function emptyFolders() {
    return `<div class="empty">${I.image}<h4>Vide pour l'instant</h4><p class="section-sub">Générez des carrousels pour remplir vos albums.</p></div>`;
  }

  function renderBar() {
    const bar = document.getElementById("albumsActionBar");
    if (!state.selected.size) { bar.innerHTML = ""; return; }
    bar.innerHTML = `<div class="action-bar"><span class="count">${state.selected.size}</span><span>image(s)</span>
      <div style="margin-left:auto;display:flex;gap:10px">
        <button class="btn btn-ghost btn-sm" id="barClear">Annuler</button>
        <button class="btn btn-primary btn-sm" id="barDl">${I.download} Télécharger la sélection</button>
      </div></div>`;
    document.getElementById("barClear").addEventListener("click", () => { state.selected.clear(); render(); });
    document.getElementById("barDl").addEventListener("click", () => toast("Téléchargement groupé (backend requis)", "cyan"));
  }

  render();
})();
</script>
</body>
</html>
