<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>CAROUBOT — Mes Créations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/design-system.css"/>
<link rel="stylesheet" href="assets/css/app.css"/>
<link rel="stylesheet" href="assets/css/theme-neon.css"/>
</head>
<body>
<div id="app"></div>

<script>window.CAROUBOT_PAGE = "creations"; window.CAROUBOT_CREDITS = null;</script>
<script src="assets/js/config.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/mascot.js"></script>
<script src="assets/js/shell.js"></script>
<script>
(function () {
  const I = window.ICON;
  const CFG = window.CAROUBOT_CONFIG;
  const el = window.CAROUBOT_SHELL.pageEl;
  let filter = "all";

  el.innerHTML = `
    <div class="page-head">
      <h1 class="page-title">${I.layers} Mes Créations</h1>
      <p class="page-subtitle">Toutes vos générations : en cours, terminées, et détails des erreurs.</p>
    </div>
    <div class="toolbar">
      <div class="seg" id="filterSeg">
        <button data-f="all" class="active">Toutes</button>
        <button data-f="running">En cours</button>
        <button data-f="done">Terminées</button>
        <button data-f="error">Erreurs</button>
      </div>
      <button class="btn btn-ghost btn-sm" id="btnClear" style="margin-left:auto">${I.trash} Vider la liste</button>
    </div>
    ${CFG.backendConnected ? "" : `<div class="notice" style="margin-bottom:18px">${I.alert} Backend non connecté : cette liste reflète les demandes enregistrées sur cet appareil. Les demandes marquées « en attente » n'ont rien exécuté ni débité.</div>`}
    <div id="creationsList"></div>
  `;

  document.getElementById("filterSeg").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    filter = b.dataset.f;
    document.querySelectorAll("#filterSeg button").forEach(x => x.classList.remove("active"));
    b.classList.add("active"); render();
  });
  document.getElementById("btnClear").addEventListener("click", () => { window.CAROUBOT_STORE.clearAll(); render(); });

  function statusBadge(s) {
    if (s === "done")  return `<span class="badge badge-success"><span class="dot"></span>Terminé</span>`;
    if (s === "error") return `<span class="badge badge-danger"><span class="dot"></span>Erreur</span>`;
    if (s === "pending_backend") return `<span class="badge badge-warning"><span class="dot"></span>En attente backend</span>`;
    return `<span class="badge badge-cyan"><span class="dot"></span>En cours</span>`;
  }

  function match(j) {
    if (filter === "all") return true;
    if (filter === "running") return j.status === "running" || j.status === "pending_backend";
    return j.status === filter;
  }

  function render() {
    const list = document.getElementById("creationsList");
    const jobs = window.CAROUBOT_STORE.getCreations().filter(match);
    if (!jobs.length) {
      list.innerHTML = `<div class="empty">${I.layers}<h4>Aucune création ${filter!=="all"?"dans ce filtre":""}</h4>
        <p class="section-sub">Lancez une génération depuis CarouSlide.</p>
        <a class="btn btn-primary" href="carouslide.html" style="margin-top:14px">${I.slide} Ouvrir CarouSlide</a></div>`;
      return;
    }
    list.className = "grid grid-2";
    list.innerHTML = jobs.map(j => `
      <div class="card">
        <div class="section-head" style="margin-bottom:12px">
          <div style="display:flex;align-items:center;gap:12px">
            <span class="creation-thumb">${I.slide}</span>
            <div><div style="font-weight:700">${j.title}</div>
            <div class="section-sub">${j.images} images · ${j.slides} slides · ${j.lang.toUpperCase()} · ${j.credits} crédits</div></div>
          </div>
          ${statusBadge(j.status)}
        </div>
        ${j.status === "running"
          ? `<div class="progress"><span style="width:${j.progress}%"></span></div><div class="section-sub" style="margin-top:8px">${j.progress}%</div>`
          : j.status === "pending_backend"
          ? `<div class="notice">${I.alert} En attente de connexion backend — aucune image générée, aucun crédit débité.</div>`
          : j.status === "error"
          ? `<div class="notice" style="color:var(--danger);border-color:rgba(251,113,133,.4);background:rgba(251,113,133,.08)">${I.alert} ${j.error || "Une erreur est survenue pendant la génération."}</div>`
          : `<div style="display:flex;gap:10px"><button class="btn btn-primary btn-sm" ${CFG.backendConnected?"":"disabled"}>${I.download} Récupérer les résultats</button><a class="btn btn-ghost btn-sm" href="albums.html">${I.albums} Voir dans Albums</a></div>`}
        <div style="display:flex;justify-content:flex-end;margin-top:12px">
          <button class="btn btn-ghost btn-sm" data-del="${j.id}">${I.trash} Supprimer</button>
        </div>
      </div>`).join("");
    list.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => { window.CAROUBOT_STORE.removeJob(b.dataset.del); render(); }));
  }

  window.addEventListener("caroubot:creations-changed", render);
  render();
})();
</script>
</body>
</html>
