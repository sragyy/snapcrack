<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>CAROUBOT — CarouRadar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/design-system.css"/>
<link rel="stylesheet" href="assets/css/app.css"/>
<link rel="stylesheet" href="assets/css/theme-neon.css"/>
<link rel="stylesheet" href="assets/css/motion.css"/>
<link rel="stylesheet" href="assets/css/premium.css"/>
</head>
<body>
<div id="app"></div>

<script>window.CAROUBOT_PAGE = "carouradar"; window.CAROUBOT_CREDITS = null;</script>
<script src="assets/js/config.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/mascot.js"></script>
<script src="assets/js/shell.js"></script>
<script>
(function () {
  const I = window.ICON;
  const CFG = window.CAROUBOT_CONFIG;
  const R = CFG.radar;
  const el = window.CAROUBOT_SHELL.pageEl;
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = n => (n == null ? "—" : Number(n).toLocaleString("fr-FR"));
  const short = n => n == null ? "—" : n >= 1e6 ? (n / 1e6).toFixed(1).replace(".", ",") + " M" : n >= 1e3 ? Math.round(n / 1e3) + " K" : String(n);

  // level : 0 = pas encore de recherche, 5 = top 5 affiché, 10 = top 10 affiché
  const state = { country: "FR", period: "7d", sort: "views", level: 0, results: [], selected: new Set(), offline: false, busy: false };
  const label = (list, code) => (R[list].find(x => x.code === code) || {}).label;

  el.innerHTML = `
    <div class="page-head">
      <h1 class="page-title">${I.radar} CarouRadar</h1>
      <p class="page-subtitle">Découvre les carrousels TikTok les plus performants, puis envoie ta sélection vers CarouSlide. Collecte à la demande, cache partagé.</p>
    </div>

    <div class="card radar-filters-card">
      <div class="toolbar" style="margin-bottom:0">
        <div>
          <label class="field-label">Pays</label>
          <div class="seg" id="segCountry">${R.countries.map(c => `<button data-v="${c.code}" class="${c.code === state.country ? "active" : ""}">${c.flag} ${c.label}</button>`).join("")}</div>
        </div>
        <div>
          <label class="field-label">Période</label>
          <div class="seg" id="segPeriod">${R.periods.map(p => `<button data-v="${p.code}" class="${p.code === state.period ? "active" : ""}">${p.label}</button>`).join("")}</div>
        </div>
        <div>
          <label class="field-label">Classement</label>
          <div class="seg" id="segSort">${R.sorts.map(x => `<button data-v="${x.code}" class="${x.code === state.sort ? "active" : ""}">${x.label}</button>`).join("")}</div>
        </div>
        <div class="radar-cta">
          <button class="btn btn-cyan" id="btnSearch">${I.radar} Rechercher le top 5 <span class="cost-chip">${I.coins} ${R.creditsTop5} crédit</span></button>
        </div>
      </div>
    </div>

    <div id="radarResults"></div>
    <div id="radarMore"></div>
    <div id="radarActionBar"></div>
  `;

  // ---------- Filtres : un changement demande une nouvelle recherche ----------
  [["segCountry", "country"], ["segPeriod", "period"], ["segSort", "sort"]].forEach(([id, key]) => {
    document.getElementById(id).addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b || state[key] === b.dataset.v) return;
      state[key] = b.dataset.v;
      document.querySelectorAll(`#${id} button`).forEach(x => x.classList.toggle("active", x === b));
      if (state.level) { state.level = 0; state.results = []; state.selected.clear(); state.offline = false; render(); toast("Filtres modifiés : relance la recherche", "cyan"); }
      else render();
    });
  });

  document.getElementById("btnSearch").addEventListener("click", async () => {
    const ok = await confirmCost({
      title: "Rechercher le top 5",
      lines: [`${label("countries", state.country)} · ${label("periods", state.period)} · classement par ${label("sorts", state.sort).toLowerCase()}`,
              "Tu pourras ensuite afficher le top 10 pour 1 crédit de plus."],
      cost: R.creditsTop5, confirmLabel: "Lancer la recherche",
      note: CFG.backendConnected ? "" : "Service non connecté : aucune recherche ne sera lancée et aucun crédit ne sera débité.",
    });
    if (ok) search(5);
  });

  async function search(limit) {
    if (state.busy) return;
    state.busy = true; render();
    try {
      if (!CFG.backendConnected) { state.offline = true; state.level = limit; state.results = []; return; }
      // Le débit du crédit est fait côté serveur, qui renvoie le classement (cache partagé).
      const res = await fetch(CFG.api.radarSearch, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ country: state.country, period: state.period, sort: state.sort, limit }),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      state.results = (Array.isArray(data) ? data : data.items || []).slice(0, limit);
      state.level = limit; state.offline = false;
    } catch (e) {
      toast("La recherche a échoué : " + esc(e.message || e), "violet");
    } finally { state.busy = false; render(); }
  }

  // ---------- Rendu ----------
  function skeleton(n, from) {
    return `<div class="card rk-card skel"><span class="rk-rank ${n <= 3 ? "" : "dim"}">#${n}</span><div class="rk-thumb">${I.slide}</div>
      <div class="rk-lines"><i></i><i></i></div>
      <div class="rk-actions"><span class="btn btn-ghost btn-sm" aria-disabled="true">${I.play} Voir</span><span class="btn btn-cyan btn-sm" aria-disabled="true">Utiliser</span></div></div>`;
  }
  function resultCard(r, n) {
    const sel = state.selected.has(r.id);
    return `<div class="card rk-card ${sel ? "picked" : ""}" data-id="${esc(r.id)}">
      <span class="rk-rank">#${n}</span>
      <span class="ck rk-ck ${sel ? "checked" : ""}" data-ck="${esc(r.id)}" role="checkbox" aria-checked="${sel}" aria-label="Sélectionner">${I.check}</span>
      <div class="rk-thumb">${r.cover ? `<img src="${esc(r.cover)}" alt="">` : I.slide}</div>
      <div class="rk-title">${esc(r.title || "Carrousel TikTok")}</div>
      <div class="rk-author">${esc(r.author || "")}</div>
      <div class="rk-stats"><span>${I.eye} ${short(r.views)} vues</span><span>${I.cart} ${short(r.sales)} ventes</span></div>
      ${r.revenue != null ? `<div class="rk-rev">CA estimé ${fmt(r.revenue)} ${CFG.pricing.currencySymbol}</div>` : ""}
      <div class="rk-actions">
        ${r.url ? `<a class="btn btn-ghost btn-sm" href="${esc(r.url)}" target="_blank" rel="noopener">${I.play} Voir</a>` : `<span class="btn btn-ghost btn-sm" aria-disabled="true">${I.play} Voir</span>`}
        <button class="btn btn-cyan btn-sm" data-use="${esc(r.id)}">Utiliser</button>
      </div></div>`;
  }

  function render() {
    const wrap = document.getElementById("radarResults"), more = document.getElementById("radarMore");
    const btn = document.getElementById("btnSearch");
    btn.disabled = state.busy;
    btn.innerHTML = state.busy ? `${I.clock} Recherche…` : state.level
      ? `${I.radar} Nouvelle recherche <span class="cost-chip">${I.coins} ${R.creditsTop5} crédit</span>`
      : `${I.radar} Rechercher le top 5 <span class="cost-chip">${I.coins} ${R.creditsTop5} crédit</span>`;

    const n = state.level || 5;
    const title = state.level ? `Top ${state.level}` : "Top 5";
    const sub = !state.level
      ? "Choisis une période et un classement, puis lance la recherche (1 crédit). Aucune collecte automatique n'est effectuée."
      : state.offline
      ? "Service CarouRadar non connecté : aucune recherche réelle, aucun crédit débité, aucun résultat inventé."
      : `${label("countries", state.country)} · ${label("periods", state.period)} · ${label("sorts", state.sort)}`;
    const head = `<div class="radar-skel-head"><div><h3 class="section-title">${I.trending} ${title} · ${label("countries", state.country)}</h3><p class="section-sub">${sub}</p></div>
      ${state.offline || !state.level ? `<span class="badge ${state.offline ? "badge-warning" : ""}"><span class="dot"></span>${state.offline ? "Non connecté" : "En attente"}</span>` : `<span class="badge badge-success"><span class="dot"></span>${state.results.length} résultat(s)</span>`}</div>`;

    const cards = state.results.length
      ? state.results.map((r, i) => resultCard(r, i + 1)).join("")
      : Array.from({ length: n }, (_, i) => skeleton(i + 1)).join("");
    wrap.innerHTML = head + `<div class="radar-grid">${cards}</div>`;

    // Bouton top 10
    more.innerHTML = state.level === 5 ? `
      <div class="radar-more">
        <button class="btn btn-primary" id="btnTop10">${I.plus} Afficher le top 10 <span class="cost-chip">${I.coins} +${R.creditsTop10} crédit</span></button>
        <p class="section-sub">Ajoute les positions 6 à 10 au classement actuel.</p>
      </div>` : state.level === 10 ? `<p class="radar-done">${I.checkCircle} Top 10 complet pour ces filtres.</p>` : "";
    document.getElementById("btnTop10")?.addEventListener("click", async () => {
      const ok = await confirmCost({
        title: "Afficher le top 10",
        lines: ["Les positions 6 à 10 s'ajoutent au classement affiché."],
        cost: R.creditsTop10, confirmLabel: "Afficher le top 10",
        note: CFG.backendConnected ? "" : "Service non connecté : aucun crédit ne sera débité.",
      });
      if (ok) search(10);
    });

    wrap.querySelectorAll("[data-ck]").forEach(c => c.addEventListener("click", e => { e.stopPropagation(); toggle(c.dataset.ck); }));
    wrap.querySelectorAll("[data-use]").forEach(b => b.addEventListener("click", () => transfer(state.results.filter(r => String(r.id) === b.dataset.use))));
    renderBar();
  }

  function toggle(id) { state.selected.has(id) ? state.selected.delete(id) : state.selected.add(id); render(); }

  function renderBar() {
    const bar = document.getElementById("radarActionBar");
    if (!state.selected.size) { bar.innerHTML = ""; return; }
    bar.innerHTML = `<div class="action-bar"><span class="count">${state.selected.size}</span><span>carrousel(s) sélectionné(s)</span>
      <div style="margin-left:auto;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" id="barClear">Désélectionner</button>
        <button class="btn btn-primary btn-sm" id="barTransfer">${I.arrowRight} Envoyer vers CarouSlide</button>
      </div></div>`;
    document.getElementById("barClear").addEventListener("click", () => { state.selected.clear(); render(); });
    document.getElementById("barTransfer").addEventListener("click", () => transfer(state.results.filter(r => state.selected.has(String(r.id)))));
  }

  // Les liens partent dans la génération massive de CarouSlide (dans l'ordre du classement)
  function transfer(items) {
    if (!items.length) return;
    window.CAROUBOT_STORE.setTransfer(items.map(r => ({ id: r.id, title: r.title, url: r.url })));
    location.href = "carouslide.html";
  }

  render();
})();
</script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/premium.js"></script>
</body>
</html>
